<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR project</title>
    
   
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
       
        .loading-overlay {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
            border-radius: 20px;
            margin: 0 auto;
            width: 200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
   
    <div class="loading-overlay" id="loadingMsg">
      
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.0/examples/image-tracking/assets/band-example/band.mind;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded>
        
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        

        <a-entity mindar-image-target="targetIndex: 0">
            
            
            <a-gltf-model 
                src="https://cdn.tinyglb.com/models/269d3dadef744f7c99997c304ce56983.glb"
                scale="0.5 0.5 0.5"
                position="0 0 0"
                rotation="0 0 0"
                animation-mixer="loop: repeat">
            </a-gltf-model>
            
    
            
        </a-entity>
    </a-scene>

   
    <script>
        const loadingMsg = document.getElementById('loadingMsg');
        
      
        setTimeout(() => {
            loadingMsg.textContent = '✅¡Modelo cargado! Apunta al marcador.';
            setTimeout(() => {
                loadingMsg.classList.add('hidden');
            }, 3000);
        }, 5000);
        
        
        window.addEventListener('error', function(e) {
            loadingMsg.textContent = '❌ Error de carga. Verifique los enlaces de los archivos.
';
            loadingMsg.style.backgroundColor = 'rgba(255,0,0,0.8)';
            console.error('AR Error:', e.message);
        });
    </script>
</body>
</html>
